name: Client checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync python -c "from pathlib import Path; Path('temp').mkdir(exist_ok=True)"
      - run: uv run --no-sync pytest -q --basetemp=temp/pytest
      - run: uv build --no-sources
      - run: uv run --no-sync openvpn-kv --help
      - run: uv run --no-sync openvpn-kv-shell --help
      - run: uv run --no-sync openvpn-kv-tui --help
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: choco install nsis --yes --no-progress
      - run: uv run --no-sync python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: dist/*
          if-no-files-found: error
          retention-days: 7
