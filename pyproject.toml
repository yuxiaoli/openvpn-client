[project]
name = "openvpn-client"
version = "0.1.0"
description = "OpenVPN Dash Client: CLI, shell and TUI for verified OpenVPN catalogs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "aiohttp>=3.12,<4", "cmd2>=4.2,<5", "httpx>=0.28,<1",
  "platformdirs>=4.3,<5", "psutil>=7,<8", "python-dotenv>=1.1,<2", "pycountry>=24.6",
  "rich>=15,<16", "textual>=8.2,<9", "typer>=0.27,<1",
  "pywin32>=311; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.2", "ruff>=0.14", "build>=1.3"]

[project.scripts]
openvpn-kv = "openvpn_cli.cli:main"
openvpn-kv-shell = "openvpn_cli.shell:main"
openvpn-kv-tui = "openvpn_cli.tui:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openvpn_cli"]

[tool.hatch.build.targets.sdist]
include = [
  "src/openvpn_cli/*.py", "tests/*.py", "scripts/package.py", "scripts/commands.sh",
  "docs/CONFIGURATION.md", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md",
  "pyproject.toml", "uv.lock", ".python-version", ".env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
